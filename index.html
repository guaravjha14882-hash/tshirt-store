
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Mobile Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #071a2f;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            padding: 15px;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #0001;
        }

        h2 {
            margin-bottom: 15px;
        }

        p {
            line-height: 1.6;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: #0b63ce;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        @media (min-width: 768px) {
            main {
                padding: 30px;
            }

            .container {
                padding: 30px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Website</h1>
    </header>

    <main>
        <div class="container">
            <h2>Welcome</h2>

            <p>
                This website is mobile-friendly.
                It can open on Android, iPhone,
                tablet and computer.
            </p>

            <button onclick="alert('Website Opened Successfully!')">
                Click Here
            </button>
        </div>
    </main>

</body>
</html>
